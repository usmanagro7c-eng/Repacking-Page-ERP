<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
  
  <!-- Subtle inner border -->
  <rect x="42" y="42" width="428" height="428" rx="94" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12" />

  <!-- Gatepass & M Monogram -->
  <g transform="translate(256, 215)" filter="url(#shadow)">
    <!-- Main M Shapes -->
    <path d="M -135 95 L -135 -75 L -55 20 L 0 -45 L 55 20 L 135 -75 L 135 95 L 90 95 L 90 5 L 55 45 L 0 -15 L -55 45 L -90 5 L -90 95 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Status / Gatepass indicator badge -->
    <circle cx="120" cy="-65" r="22" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4" />
    <path d="M 112 -65 L 118 -59 L 129 -72" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- MMMC Typography -->
  <text x="256" y="405" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#ffffff" 
        text-anchor="middle">
    MMMC
  </text>

  <!-- Subtitle -->
  <text x="256" y="445" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="7" 
        fill="#fbbf24" 
        text-anchor="middle">
    GATEPASS
  </text>
</svg>